name: Build and push images

on:
  workflow_dispatch:
    inputs:
      dockerhubImageName:
        description: 'dockerhub image name, default is dockerhub repository slug, needs start with index.docker.io/'
      ghcrImageName:
        description: 'ghcr.io image name, default is github repository slug, needs start with ghcr.io/'
      awsEcrImageName:
        description: 'AWS ECR image name, defaule is aws ecr repository slug, needs start with public.ecr.aws/'
  schedule:
    # every Wednesday at 3:42 AM(UTC, Beijing time: 11:42 AM)
    - cron:  '42 3 * * 3'

env:
  PUBLIC_MIRROR: "https://dl-cdn.alpinelinux.org" # no mirror needed at github actions

jobs:
  prepare:
    name: Prepare matrix
    runs-on: 'ubuntu-latest'
    outputs:
      tasks: ${{ steps.gentasks.outputs.tasks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate tasks
        id: gentasks
        run: |
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} python3 .github/workflows/generate_tasks.py

  build:
    name: ${{ matrix.tasks.tag }} build and push
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        tasks: ${{ fromJson(needs.prepare.outputs.tasks) }}
      max-parallel: 5
      fail-fast: false
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      # checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up secrets
        shell: python3 {0}
        id: set-secrets
        run: |
          import os, json, base64

          githubOutput = open(os.environ["GITHUB_OUTPUT"], "w")
          fw = open(os.path.expanduser("~/.docker/config.json"), "w")

          config = {
            "auths": {},
          }

          imageNames = []

          # GHCR
          cred = base64.b64encode(b'whatever:${{ github.token }}').decode()
          config["auths"]["ghcr.io"] = {
            "auth": cred,
          }
          imageNames.append("${{ inputs.ghcrImageName }}" or "ghcr.io/${{ github.repository }}")

          # AWS ECR
          cred = "${{ secrets.AWS_ECR_CRED }}"
          if cred:
            config["auths"]["public.ecr.aws"] = {
              "auth": cred,
            }
            imageNames.append("${{ inputs.awsEcrImageName }}" or "public.ecr.aws/${{ github.repository }}")

          # DockerHub
          cred = "${{ secrets.DOCKERHUB_CRED }}"
          if cred:
            config["auths"]["https://index.docker.io/v1/"] = {
              "auth": cred,
            }
            imageNames.append("${{ inputs.dockerhubImageName }}" or "index.docker.io/${{ github.repository }}")

          strippedImageNames = ",".join([f"{image}:${{ matrix.tasks.tag }}" for image in imageNames])
          debuggableImageNames = ",".join([f"{image}:${{ matrix.tasks.tag }}-debuggable" for image in imageNames])
          githubOutput.write(f"strippedImageNames={strippedImageNames}\n")
          githubOutput.write(f"debuggableImageNames={debuggableImageNames}\n")
          fw.write(json.dumps(config))
          fw.close()

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push debuggable image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.tasks.platforms }}
          context: .
          no-cache: true
          pull: true
          push: true
          target: debuggable
          provenance: mode=max
          build-args: ${{ matrix.tasks.args }}
          tags: ${{ steps.set-secrets.outputs.debuggableImageNames }}

      - name: Build and push stripped image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.tasks.platforms }}
          context: .
          no-cache: false
          pull: false
          push: true
          target: stripped
          provenance: mode=max
          build-args: ${{ matrix.tasks.args }}
          tags: ${{ steps.set-secrets.outputs.strippedImageNames }}
